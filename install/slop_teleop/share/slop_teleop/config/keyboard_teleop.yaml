# Slop-Bot Tastatursteuerung. Wird von "ros2 run slop_teleop keyboard_teleop" automatisch geladen.
# Eigene Datei statt dieser: ... keyboard_teleop --ros-args --params-file meine.yaml
# Einzelwert ändern:         ... keyboard_teleop --ros-args -p max_linear:=0.03
# Tastenbelegung siehe slop_teleop/keys.py.
keyboard_teleop:
  ros__parameters:
    cmd_vel_topic: teleop/cmd_vel   # Eingang "teleop" von twist_mux (slop_safety/config/twist_mux.yaml)

    # Geschwindigkeit bei 100 %. Passend zu diff_drive.yaml (max_wheel_rpm 10 → 0,037 m/s, 0,31 rad/s).
    # Wird dort max_wheel_rpm erhöht, hier mit anheben. Zu hohe Werte bremst diff_drive_node ohnehin ein.
    max_linear: 0.03         # m/s
    max_angular: 0.2         # rad/s
    scale: 1.0                # Start-Tempo 0,1…1 (Anteil von max_*), mit +/- änderbar
    scale_step: 0.1           # Schrittweite von +/-

    # Totmann: Ein Terminal meldet kein Loslassen, nur Tastenwiederholungen
    first_timeout: 0.7        # s nach dem ersten Druck; länger als die Wiederholverzögerung des Systems
    repeat_timeout: 0.25      # s ohne weitere Wiederholung → Taste losgelassen
    stop_hold: 0.3            # s Nullbefehle nach dem Loslassen, danach still (Navigation darf wieder)
    rate: 20.0                # Hz, Senderate beim Fahren

    # Anzeige der Fahrsperre in der Statuszeile (steuert nichts)
    lock_topic: /safety/remote_lock   # '' = keine Anzeige
    lock_timeout: 1.0                 # s ohne Nachricht → "remote_guard läuft nicht?"

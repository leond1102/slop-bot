# EKF der Odometrie (robot_localization). Ausgang: /odom und TF odom → base_footprint (einzige Quelle dafür).
# Neue Sensoren: unten einen weiteren Block (odom2, imu1, ...) einfügen, alles andere bleibt.
#
# Eingänge: Wahl der Größen je Sensor über <name>_config, Reihenfolge der 15 Werte:
#   x, y, z,  roll, pitch, yaw,  vx, vy, vz,  vroll, vpitch, vyaw,  ax, ay, az
# Faustregeln: Geschwindigkeiten statt Positionen fusionieren (sonst wird doppelt integriert), jede Größe nur aus der
# besten Quelle. Die Unsicherheit je Größe kommt aus der Kovarianz der Nachricht (Sensortreiber / diff_drive_node).
ekf_filter_node:
  ros__parameters:
    frequency: 50.0           # Hz, Takt von Ausgang und TF
    sensor_timeout: 0.2       # s ohne Nachricht → die Quelle zählt nicht mehr
    two_d_mode: true          # Bodenroboter: z, roll, pitch und deren Geschwindigkeiten bleiben 0
    publish_tf: true
    publish_acceleration: false
    print_diagnostics: true

    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint   # wie child_frame_id der Radodometrie
    world_frame: odom                 # nur odom-Quellen: kontinuierlich, ohne Sprünge. map → odom macht später das SLAM

    # --- Quelle 1: Radodometrie (diff_drive_node, Schritte ohne Encoder) ---
    # Nur Vorwärts- und Drehgeschwindigkeit; die Pose daraus bildet der EKF selbst.
    odom0: /wheel/odom
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  false, false,
                   false, false, true,
                   false, false, false]
    odom0_queue_size: 10
    odom0_differential: false
    odom0_relative: false

    # --- Quelle 2: Gyro der Livox-IMU (nur die Drehrate um z) ---
    # Kommt von imu_adapter (slop_localization): Beschleunigung in m/s², Gyro-Bias abgezogen, Kovarianzen gesetzt.
    # Der Gyro driftet viel weniger als Radschlupf; die Drehrate der Räder zählt wegen der größeren Kovarianz kaum noch.
    # Die Umrechnung livox_frame → base_footprint macht der EKF über das TF des Modells (robot_state_publisher).
    # Beschleunigung bleibt aus: im 2D-Betrieb bei max. 0,18 m/s nur Rauschen und Vibration.
    imu0: /imu/livox
    imu0_config: [false, false, false,
                  false, false, false,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    imu0_queue_size: 50
    imu0_differential: false
    imu0_relative: false
    imu0_remove_gravitational_acceleration: false

    # --- Quelle 3: LIO (FAST-LIO über slop_lio/lio_bridge) – nur die Geschwindigkeit ---
    # Nicht die Pose in map: Die Pose in map bräuchte das TF map → odom, und das bildet die Brücke aus dem Ergebnis dieses
    # Filters (Zirkelbezug). Die Geschwindigkeit im Roboterframe braucht kein TF. Läuft LIO nicht oder liefert es Unsinn,
    # setzt die Brücke die Kovarianz auf 1e6 bzw. es kommt nichts; der Filter fährt dann auf Rädern und Gyro.
    odom1: /lio/odom
    odom1_config: [false, false, false,
                   false, false, false,
                   true,  false, false,
                   false, false, true,
                   false, false, false]
    odom1_queue_size: 10
    odom1_differential: false
    odom1_relative: false

# Slop-Bot: Differentialantrieb, zwei Schrittmotoren ohne Encoder am CL57E-4A (EtherCAT).
# Geometrie: angetriebene Räder vorne, Spur 24 cm, Raddurchmesser 7 cm.
# Frei schwenkende Schleppräder 34 cm dahinter (nur für URDF/Footprint wichtig, nicht für die Kinematik).
# base_footprint = Mitte zwischen den angetriebenen Rädern am Boden.
diff_drive_node:
  ros__parameters:
    ifname: enP8p1s0          # Ethernet-Port des EtherCAT-Busses
    cycle_ms: 2.0
    dc: false

    # Echtzeit für den Zyklus-Thread (braucht den Start über with_netcaps, sonst nur Warnung im Log).
    # rt_cpu: eigener Kern. Der Interrupt der EtherCAT-Karte bleibt auf dem Orin fest auf CPU0 (PCIe-MSI);
    # with_netcaps legt dafür die USB-Interrupts von CPU0 auf CPU1.
    rt_priority: 80           # SCHED_FIFO, 0 = aus
    rt_cpu: 7                 # -1 = beliebiger Kern
    main_nice: -10            # ROS-Thread der Node bevorzugen (teilt sich das GIL mit dem Zyklus)
    gil_switch_ms: 0.5
    stats_period: 10.0        # s, Zyklusstatistik im Log (verspätete Zyklen, max. Periode), 0 = aus
    slow_update_ms: 50.0      # ms, Warnung im Log, wenn der ROS-Thread so lange blockiert (zeigt wo), 0 = aus

    # Planetengetriebe NEMA 17, am Motor: Achse 3 = 1:5,18, Achse 4 = 1:13,73 (Nennwerte, mit tools/diff_motor.py
    # jog --revs 10 nachgezählt: links 5,13, rechts 13,7)
    left_axis: 3
    left_gear: 5.18
    left_dir: 1
    right_axis: 4
    right_gear: 13.73
    right_dir: -1             # Motor gespiegelt eingebaut
    units_per_rev: 0          # 0 = aus Treiber (DivSet, aktuell 10000)

    wheel_diameter: 0.07      # m
    track_width: 0.24         # m, Abstand der Radmitten
    max_wheel_rpm: 50.0       # → 0,183 m/s, 1,53 rad/s (einzige Stelle für die Tempogrenze, auch für tools/diff_motor.py)
    wheel_acc: 6.0            # rad/s² am Rad (≈ 1 U/s², 10 U/min in 0,2 s)

    loop: open                # Schrittmotoren ohne Encoder
    max_ferr_rev: 1.0         # Open Loop: greift nur, wenn der Treiber nicht mehr mitzählt
    motor_current_ma: 0       # TODO: Nennstrom vom Typenschild, dann wird MaxCurrent (1300 mA) geprüft

    enable_on_start: true
    cmd_vel_timeout: 0.5      # s ohne /cmd_vel → Stopp
    arm_delay: 1.0            # s Ruhe nach dem Freigeben, bevor Fahrbefehle zählen
    lock_topic: /safety/remote_lock   # Fahrsperre von slop_safety/remote_guard, '' = aus
    lock_timeout: 1.0         # s ohne Nachricht → gesperrt
    allowed_cmd_vel_nodes: [twist_mux]   # nur twist_mux darf auf /cmd_vel senden
    rate: 50.0

    # Radodometrie aus den ausgegebenen Schritten (Open Loop, driftet). Sie geht als Rohwert nach /wheel/odom in den
    # EKF (slop_localization), der /odom und das TF odom → base_footprint sendet. publish_tf: true nur ohne EKF.
    odom_topic: /wheel/odom
    odom_frame: odom
    base_frame: base_footprint
    publish_tf: false
    left_joint: left_wheel_joint
    right_joint: right_wheel_joint

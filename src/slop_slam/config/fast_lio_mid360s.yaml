# FAST-LIO2 für den Livox Mid-360s am Slop-Bot. Grundlage: FAST_LIO/config/mid360.yaml.
# Geändert: extrinsic_est_en aus (Bodenroboter regt die Schätzung kaum an), feinere Filter für Innenräume,
# Karte veröffentlichen und speicherbar (map_file_path setzt lio.launch.py).
/**:
    ros__parameters:
        feature_extract_enable: false
        point_filter_num: 3
        max_iteration: 3
        filter_size_surf: 0.3        # m, Voxelgröße des Scans (Original 0.5, für Innenräume feiner)
        filter_size_map: 0.3         # m, Voxelgröße der Karte
        cube_side_length: 1000.0
        runtime_pos_log_enable: false
        map_file_path: ""            # kommt aus lio.launch.py

        common:
            lid_topic:  "/livox/lidar"     # CustomMsg (xfer_format 1)
            imu_topic:  "/livox/imu"       # Beschleunigung in g, FAST-LIO skaliert selbst auf m/s²
            time_sync_en: false
            time_offset_lidar_to_imu: 0.0

        preprocess:
            lidar_type: 1            # Livox CustomMsg
            scan_line:  4
            blind: 0.5               # m, nähere Punkte (eigener Roboter) ignorieren
            timestamp_unit: 3
            scan_rate: 10

        mapping:
            acc_cov: 0.1
            gyr_cov: 0.1
            b_acc_cov: 0.0001
            b_gyr_cov: 0.0001
            fov_degree:    360.0
            det_range:     50.0      # m
            extrinsic_est_en: false
            # Lidar im IMU-Frame (Mid-360, gleiche Werte in slop_slam/lio_tf: extrinsic_T)
            extrinsic_T: [ -0.011, -0.02329, 0.04412 ]
            extrinsic_R: [ 1., 0., 0.,
                           0., 1., 0.,
                           0., 0., 1.]

        publish:
            path_en: true
            effect_map_en: false
            map_en: true             # /Laser_map: jede Sekunde ein Scan dazu (wächst unbegrenzt)
            scan_publish_en: true
            dense_publish_en: false  # /cloud_registered ausgedünnt
            scan_bodyframe_pub_en: false

        pcd_save:
            pcd_save_en: true        # Speichern per Service /map_save (schreibt /Laser_map nach map_file_path)
            interval: -1

# Lidar → 2D-Scan für slam_toolbox / Nav2. Gestartet von slop_lio/launch/lio.launch.py (scan:=true, Standard).
#
#   /livox/lidar (CustomMsg) ─► livox_to_cloud ─► /livox/points (PointCloud2, livox_frame, Roboter ausgeschnitten)
#                                                   └─► pointcloud_to_laserscan ─► /scan (LaserScan, base_footprint)
#
# Die Quader, die den Roboter selbst ausschneiden (exclude_boxes), setzt lio.launch.py: dieselben wie für FAST-LIO
# (URDF + slop_lio/config/crop.yaml).
livox_to_cloud:
  ros__parameters:
    input_topic: /livox/lidar
    output_topic: /livox/points
    blind: 0.3          # m, näher am Lidar wird verworfen (Eigenreflexe); FAST-LIO nimmt 0,5
    keep_every: 1       # jeder n-te Punkt (1 = alle, ca. 16 000 je Scan)

pointcloud_to_laserscan:
  ros__parameters:
    target_frame: base_footprint   # Scan liegt in der Bodenebene des Roboters (Neigung des Lidars aus dem URDF)
    transform_tolerance: 0.05
    # Höhenband über dem Boden, das in den Scan eingeht. Das Mid-360 schaut nur 7° nach unten und sitzt 0,315 m hoch:
    # Boden trifft es erst ab ca. 2,6 m. min_height über dem Bodenrauschen, max_height unter der Decke.
    min_height: 0.15
    max_height: 1.80
    # 0,5°: 721 Strahlen (der letzte überlappt den ersten). So gewählt, weil slam_toolbox (Karto) round(Spanne/Schritt) + 1
    # Strahlen erwartet und pointcloud_to_laserscan ceil(Spanne/Schritt) liefert; mit ±π und 0,00873 waren es 721 gegen 720.
    angle_min: -3.1416
    angle_max: 3.1416
    angle_increment: 0.0087266
    scan_time: 0.1                 # s, = publish_freq 10 Hz
    range_min: 0.2
    range_max: 30.0
    use_inf: true
    inf_epsilon: 1.0

# Parameter für realsense2_camera (D435i, Seriennummer 262722070636).
# Topics landen unter /camera/... (Node-Name "camera", kein Namespace).
camera:
  ros__parameters:
    camera_name: camera
    base_frame_id: link   # wird zu <camera_name>_link = camera_link

    enable_color: true
    enable_depth: true
    enable_infra1: false
    enable_infra2: false
    rgb_camera.color_profile: 640,480,30
    depth_module.depth_profile: 640,480,30

    # Tiefe aufs Farbbild umrechnen (/camera/aligned_depth_to_color/image_raw): aus, kostet CPU
    align_depth.enable: false
    # Punktwolke /camera/depth/color/points (kostet CPU). Auf dem Jetson heißt der Filter
    # "Pointcloud (NEON)" → Parameter pointcloud__neon_.* statt pointcloud.* (ein-/ausschalten
    # per Launch-Argument camera_pointcloud:=true, überschreibt diesen Wert).
    pointcloud__neon_.enable: false

    # IMU: Gyro + Accel vereint auf /camera/imu (unite_imu_method 2 = linear interpoliert).
    # Geht nur, weil realsense2_camera hier gegen librealsense mit RSUSB-Backend gebaut ist
    # (~/librealsense-rsusb, siehe colcon.meta): Der Jetson-Kernel hat kein HID-Sensor-Hub,
    # mit der apt-Version (/opt/ros/humble) meldet der Node "No HID info provided, IMU is disabled".
    enable_gyro: true
    enable_accel: true
    unite_imu_method: 2

    # 50-Hz-Netz (Deutschland): 1 = 50 Hz, gegen Flackern unter Kunstlicht
    rgb_camera.power_line_frequency: 1

    # Filter gegen Löcher/Rauschen in der Tiefe
    decimation_filter.enable: false
    spatial_filter.enable: false
    temporal_filter.enable: false

    # TFs innerhalb der Kamera (camera_link → Sensor- und optische Frames), vom Treiber selbst
    publish_tf: true
    tf_publish_rate: 0.0
    initial_reset: false

# Montagepositionen der Sensoren relativ zu base_footprint (Boden unter Achsmitte).
# x nach vorn, y nach links, z nach oben [m]; roll/pitch/yaw [rad].
#
# gravity: true → roll und pitch misst mount_tf beim Start mit der IMU des Sensors (Roboter muss still
#   und waagrecht stehen). Die Werte roll/pitch hier gelten dann nur, bis die Messung fertig ist.
#   Neu messen: ros2 service call /mount_tf/recalibrate std_srvs/srv/Trigger
# yaw (Blickrichtung) und x/y/z sind aus der Schwerkraft NICHT bestimmbar → hier eintragen.
#
# TODO: x/y/z und yaw am Roboter nachmessen – die Werte hier sind Platzhalter!
livox:
  frame: livox_frame
  imu_topic: /livox/imu       # IMU im Lidar, gleiche Achsen wie die Punktwolke
  gravity: true
  x: 0.0
  y: 0.0
  z: 0.30
  roll: 0.0
  pitch: 0.0
  yaw: 0.0
camera:
  frame: camera_link
  imu_topic: /camera/imu      # liegt im camera_imu_optical_frame, wird über die Treiber-TF gedreht
  gravity: true
  x: 0.15
  y: 0.0
  z: 0.20
  roll: 0.0
  pitch: 0.0
  yaw: 0.0

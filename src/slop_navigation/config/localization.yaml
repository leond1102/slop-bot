# Lokalisierung in einer gespeicherten Karte: map_server (lädt maps/<name>.yaml) + AMCL (Partikelfilter auf /scan).
# Gestartet von localization.launch.py. Grundlage: nav2_bringup/params/nav2_params.yaml (Humble).
# AMCL sendet map → odom (lio.launch.py läuft dafür mit map_tf:=false) und setzt auf der EKF-Odometrie auf.
map_server:
  ros__parameters:
    yaml_filename: ""            # setzt localization.launch.py (Argument map)
    topic_name: map
    frame_id: map

amcl:
  ros__parameters:
    base_frame_id: base_footprint
    global_frame_id: map
    odom_frame_id: odom
    scan_topic: scan
    robot_model_type: nav2_amcl::DifferentialMotionModel

    # Rauschen der Odometrie (Anteil): 0,2 im Standard. Die EKF-Odometrie mit LIO-Geschwindigkeit ist deutlich besser
    # als reine Radodometrie, deshalb kleiner.
    alpha1: 0.1                  # Drehung aus Drehung
    alpha2: 0.1                  # Drehung aus Fahrt
    alpha3: 0.1                  # Fahrt aus Fahrt
    alpha4: 0.1                  # Fahrt aus Drehung
    alpha5: 0.1

    # Scan: 360°, 721 Strahlen in base_footprint (pointcloud_to_laserscan); 60 davon gleichmäßig verteilt werden genutzt
    laser_model_type: likelihood_field
    laser_min_range: 0.2
    laser_max_range: 20.0        # wie max_laser_range beim Kartieren
    laser_likelihood_max_dist: 2.0
    max_beams: 60
    sigma_hit: 0.2
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    lambda_short: 0.1
    do_beamskip: false
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3

    # Partikel
    min_particles: 500
    max_particles: 2000
    pf_err: 0.05
    pf_z: 0.99
    resample_interval: 1
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0

    # Neuberechnung nach so viel Bewegung (Standard 0,25 m / 0,2 rad; der Roboter ist langsam)
    update_min_d: 0.10           # m
    update_min_a: 0.15           # rad

    tf_broadcast: true
    transform_tolerance: 0.5     # s, map → odom wird so weit in die Zukunft datiert
    save_pose_rate: 0.5

    # Startpose in der Karte (map = Startlage beim Kartieren). localization.launch.py setzt sie aus x, y, yaw;
    # sonst in RViz mit "2D Pose Estimate".
    set_initial_pose: true
    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0

lifecycle_manager_localization:
  ros__parameters:
    autostart: true
    node_names: [map_server, amcl]
    bond_timeout: 4.0

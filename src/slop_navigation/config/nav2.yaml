# Nav2 für den Slop-Bot (navigation.launch.py). Grundlage: nav2_bringup/params/nav2_params.yaml (Humble 1.1).
#
# Roboter: Differentialantrieb, Drehpunkt = Antriebsachse = base_footprint. Körper 50 × 32 cm, beginnt 10 cm vor der
# Achse, davor der Greifer (21 cm, 20 cm breit). Footprint und Zonen kommen beim Start aus dem URDF. Höchstens 0,18 m/s.
#
# Zwei Sicherheitsstufen (navigation.launch.py safety:=streng|locker):
#   streng (Standard, diese Datei): nie rückwärts (RPP allow_reversing false, velocity_smoother min_velocity x = 0, keine
#           BackUp-Recovery), zwei Collision Monitore mit Abstand zu Unbekanntem, langsamer in der Nähe von Hindernissen.
#   locker  (zusätzlich nav2_locker.yaml): extrem nah an alles, volles Tempo, rückwärts erlaubt (Details dort).
#
# Befehlskette:  controller_server / behavior_server ─cmd_vel_nav─► velocity_smoother ─cmd_vel_smoothed─►
#                collision_monitor_dynamic ─cmd_vel_dynamic─► collision_monitor ─/navigation/cmd_vel─►
#                twist_mux (Priorität 20, Tastatur 50) ─/cmd_vel─► diff_drive_node
#                (zwei Collision Monitore: unbekannte Hindernisse mit großen, alles mit sehr kleinen Zonen – siehe unten)
#
# Sensoren für Costmaps und Collision Monitore: VORERST NUR DAS LIDAR.
#   /scan              Lidar, 360°, Höhenband 0,15–1,8 m (sieht niedrige Dinge erst ab ca. 2,6 m)
# Kamera (vorerst aus, Einträge unten bleiben stehen; zum Einschalten wieder in die observation_sources aufnehmen und in
# slop_safety/config/sensor_guard.yaml überwachen lassen):
#   /camera/obstacles  RealSense vorn, Hindernisse 0,05–0,9 m, 0,25–2,5 m vor der Kamera (base_footprint)
#   /camera/floor      RealSense, freier Boden: räumt Zellen frei (Raytracing von der Kamera aus)
# Ohne Kamera sieht Nav2 nichts unter 0,15 m Höhe (Kabel, flache Kisten, Füße von Stühlen).

bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    # eigene Verhaltensbäume ohne Rückwärtsfahren; setzt navigation.launch.py (Pfad im Paket)
    default_nav_to_pose_bt_xml: ""
    default_nav_through_poses_bt_xml: ""
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_smooth_path_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_assisted_teleop_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_drive_on_heading_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_globally_updated_goal_condition_bt_node
      - nav2_is_path_valid_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_truncate_path_action_bt_node
      - nav2_truncate_path_local_action_bt_node
      - nav2_goal_updater_node_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_path_expiring_timer_condition
      - nav2_distance_traveled_condition_bt_node
      - nav2_single_trigger_bt_node
      - nav2_goal_updated_controller_bt_node
      - nav2_is_battery_low_condition_bt_node
      - nav2_navigate_through_poses_action_bt_node
      - nav2_navigate_to_pose_action_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_planner_selector_bt_node
      - nav2_controller_selector_bt_node
      - nav2_goal_checker_selector_bt_node
      - nav2_controller_cancel_bt_node
      - nav2_path_longer_on_approach_bt_node
      - nav2_wait_cancel_bt_node
      - nav2_spin_cancel_bt_node
      - nav2_back_up_cancel_bt_node
      - nav2_assisted_teleop_cancel_bt_node
      - nav2_drive_on_heading_cancel_bt_node
      - nav2_is_battery_charging_condition_bt_node

# ---------------------------------------------------------------------------------------------------- Controller
controller_server:
  ros__parameters:
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.2      # m in movement_time_allowance (bei 0,15 m/s locker erreichbar)
      movement_time_allowance: 15.0
    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      stateful: True
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.25
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.15           # m/s (Antrieb höchstens 0,183)
      lookahead_dist: 0.5
      min_lookahead_dist: 0.3
      max_lookahead_dist: 0.9
      lookahead_time: 1.5
      use_velocity_scaled_lookahead_dist: false
      rotate_to_heading_angular_vel: 0.5 # rad/s; das Heck schwenkt dabei mit 0,4 m Radius
      use_rotate_to_heading: true
      rotate_to_heading_min_angle: 0.6
      max_angular_accel: 1.0
      allow_reversing: false             # nie rückwärts (hinten keine Hinderniserkennung in Bodennähe)
      transform_tolerance: 0.3
      min_approach_linear_velocity: 0.03
      approach_velocity_scaling_dist: 0.5
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.5
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.05
      cost_scaling_dist: 0.4
      cost_scaling_gain: 1.0
      inflation_cost_scaling_factor: 4.0 # wie in den Costmaps
      max_robot_pose_search_dist: 10.0

# ---------------------------------------------------------------------------------------------------- Costmaps
# Footprint (base_footprint, x vorn, y links) kommt aus dem URDF (slop_description): navigation.launch.py rechnet ihn
# beim Start und überschreibt den Wert hier (config/zones.yaml, slop_navigation/footprint.py). T-Form: Körper 10 cm vor
# bis 40 cm hinter der Achse, ±16 cm; davor der Greifer bis 31 cm vor der Achse, ±10 cm (Backen ±9 cm).
# Innenkreis 0,14 m, Außenkreis (hintere Ecken) 0,43 m.
local_costmap:
  local_costmap:
    ros__parameters:
      global_frame: odom                 # stetig (EKF), springt nicht bei AMCL-Korrekturen
      robot_base_frame: base_footprint
      update_frequency: 5.0
      publish_frequency: 2.0
      transform_tolerance: 0.3
      rolling_window: true
      width: 4                           # m, mitfahrendes Fenster um den Roboter
      height: 4
      resolution: 0.05
      footprint: "[[-0.4, -0.16], [0.1, -0.16], [0.1, -0.1], [0.13, -0.1], [0.13, -0.09], [0.31, -0.09], [0.31, 0.09], [0.13, 0.09], [0.13, 0.1], [0.1, 0.1], [0.1, 0.16], [-0.4, 0.16]]"   # aus dem URDF, siehe oben
      footprint_padding: 0.02
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        footprint_clearing_enabled: true
        observation_sources: scan        # Kamera vorerst aus: scan camera_obstacles camera_floor
        scan:
          topic: /scan
          data_type: "LaserScan"
          marking: True
          clearing: True
          min_obstacle_height: -0.1      # /scan liegt in base_footprint (z = 0)
          max_obstacle_height: 2.0
          obstacle_min_range: 0.0
          obstacle_max_range: 3.0
          raytrace_min_range: 0.0
          raytrace_max_range: 4.0
          inf_is_valid: true             # inf = nichts bis zur Reichweite: räumt frei
        camera_obstacles:
          topic: /camera/obstacles
          data_type: "PointCloud2"
          sensor_frame: camera_link      # Ursprung für das Raytracing (Wolke liegt in base_footprint)
          marking: True
          clearing: False
          min_obstacle_height: 0.04
          max_obstacle_height: 1.0
          obstacle_min_range: 0.0
          obstacle_max_range: 2.5
        camera_floor:
          topic: /camera/floor
          data_type: "PointCloud2"
          sensor_frame: camera_link
          marking: False
          clearing: True                 # freier Boden: Zellen zwischen Kamera und Bodenpunkt werden frei
          min_obstacle_height: -0.1      # Bodenpunkte liegen bei z = 0
          max_obstacle_height: 0.1
          raytrace_min_range: 0.0
          raytrace_max_range: 2.5
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.45           # etwas mehr als der Außenkreis
        cost_scaling_factor: 4.0
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      global_frame: map
      robot_base_frame: base_footprint
      update_frequency: 1.0
      publish_frequency: 1.0
      transform_tolerance: 0.5
      resolution: 0.05
      track_unknown_space: true          # unbekannt bleibt unbekannt (der Planer fährt nicht hinein, allow_unknown)
      footprint: "[[-0.4, -0.16], [0.1, -0.16], [0.1, -0.1], [0.13, -0.1], [0.13, -0.09], [0.31, -0.09], [0.31, 0.09], [0.13, 0.09], [0.13, 0.1], [0.1, 0.1], [0.1, 0.16], [-0.4, 0.16]]"   # aus dem URDF, siehe oben
      footprint_padding: 0.02
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        footprint_clearing_enabled: true
        # 0 = Overwrite: Was die Sensoren gerade sehen, ersetzt die Karte – auch frei. Ein Stuhl, der beim Kartieren im
        # Weg stand, verschwindet, sobald das Lidar durch seine Zelle sieht. Nicht gesehene Zellen behalten die Karte
        # (geht nur mit track_unknown_space: true, sonst löschte die Schicht die Karte großflächig).
        combination_method: 0
        observation_sources: scan        # Kamera vorerst aus: scan camera_obstacles camera_floor
        scan:
          topic: /scan
          data_type: "LaserScan"
          marking: True
          clearing: True
          min_obstacle_height: -0.1
          max_obstacle_height: 2.0
          obstacle_max_range: 5.0
          raytrace_max_range: 6.0
          inf_is_valid: true
        camera_obstacles:
          topic: /camera/obstacles
          data_type: "PointCloud2"
          sensor_frame: camera_link
          marking: True
          clearing: False
          min_obstacle_height: 0.04
          max_obstacle_height: 1.0
          obstacle_max_range: 2.5
        camera_floor:
          topic: /camera/floor
          data_type: "PointCloud2"
          sensor_frame: camera_link
          marking: False
          clearing: True
          min_obstacle_height: -0.1
          max_obstacle_height: 0.1
          raytrace_max_range: 2.5
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.45
        cost_scaling_factor: 4.0
      always_send_full_costmap: True
      # Erfahrungskarte (slop_navigation/experience): Stellen, an denen oft etwas steht (Stühle), werden teurer, aber
      # nie verboten (Kosten ≤ 150 von 254). Wirkt erst, wenn der Knoten mit soft_costs läuft und die Filter-Info sendet
      # (navigation.launch.py experience_costs:=true); vorher wartet der Filter nur.
      filters: ["experience_filter"]
      experience_filter:
        plugin: "nav2_costmap_2d::KeepoutFilter"
        enabled: True
        filter_info_topic: "/experience/filter_info"

# ---------------------------------------------------------------------------------------------------- Planer
planner_server:
  ros__parameters:
    expected_planner_frequency: 1.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.3                     # m, Ziel darf so weit in einem Hindernis liegen
      use_astar: true
      allow_unknown: false               # nicht durch unbekannte Bereiche der Karte planen

# ---------------------------------------------------------------------------------------------------- Recovery
behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "wait"]   # ohne backup und drive_on_heading (nicht rückwärts)
    spin:
      plugin: "nav2_behaviors/Spin"
    wait:
      plugin: "nav2_behaviors/Wait"
    global_frame: odom
    robot_base_frame: base_footprint
    transform_tolerance: 0.3
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.5
    min_rotational_vel: 0.2
    rotational_acc_lim: 1.0

# ---------------------------------------------------------------------------------------------------- Sicherheit
velocity_smoother:
  ros__parameters:
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    max_velocity: [0.18, 0.0, 0.6]       # m/s, -, rad/s
    min_velocity: [0.0, 0.0, -0.6]       # x = 0: nie rückwärts, egal was der Controller will
    max_accel: [0.2, 0.0, 1.0]
    max_decel: [-0.3, 0.0, -1.5]
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

# Zwei Collision Monitore hintereinander (jeder kann nur bremsen):
#
#   velocity_smoother ─cmd_vel_smoothed─► collision_monitor_dynamic ─cmd_vel_dynamic─► collision_monitor ─/navigation/cmd_vel─►
#                                         B: nur UNBEKANNTE Hindernisse,               A: ALLE Punkte, kartenunabhängig,
#                                            größere Zonen (Mensch, Stuhl, Kiste)         sehr kleine Zonen (letzte Bremse)
#
# Unbekannt = Lidar-Punkte, die nicht auf bekannter Struktur liegen (unknown_obstacles: Karte + Erfahrungskarte) (mit
# Kamera: dazu alle Kamera-Hindernisse, flache Dinge sind nie Wand). Im Zweifel (keine Karte, Lokalisierung unsicher) gilt
# alles als unbekannt, dann gelten die größeren Zonen auch für Wände. Wände passiert der Roboter so eng, Menschen mit Abstand.
# Gilt für safety:=streng. Bei safety:=locker läuft B nicht, A hat andere Zonen (nav2_locker.yaml).
#
# Zonen in base_footprint (x vorn, y links), Footprint siehe Costmaps (T-Form mit Greifer). Die points aller Zonen
# berechnet navigation.launch.py beim Start aus dem URDF mit den Zuschlägen aus config/zones.yaml (die Werte hier sind
# nur der Stand dazu, damit die Datei allein gültig ist). Ein Polygon greift, wenn MEHR als
# max_points Punkte darin liegen.
# Bremsweg: 0,18 m/s → ca. 7 cm Rampe (≈ 0,2 m/s²) + 0,15 s Reaktion (Scan, Zyklus) ≈ 10 cm; mit 40 % (0,07 m/s) ≈ 2,4 cm.
# Deshalb sind die 2-cm-Stoppzone und die 10-cm-Langsamzone von A nur zusammen mit dem Approach-Polygon sicher: Es bremst
# frontal so früh, dass bis zur Berührung ≥ 0,6 s bleiben (bei 2 cm Abstand höchstens 0,03 m/s).
# Flache Hindernisse (< 0,15 m) sieht nur die Kamera – und die ist vorerst aus. Mit Kamera (erst ab 0,25 m vor ihr): B
# bremst sie in der Langsam-Zone (bis 40 cm) ab, angehalten wird davor über die lokale Costmap (merkt sich
# Kamera-Hindernisse) und die Kollisionsprüfung des Controllers (RPP), nicht über die Stoppzonen.
#
# Humble (1.1.20): eine Quelle, die länger als source_timeout nichts liefert, wird IGNORIERT (kein Stopp!). Fällt /scan
# aus, fehlte der Lidar-Schutz. Dasselbe, wenn das TF odom → base_footprint (EKF) fehlt: dann ALLE Quellen. Deshalb
# sperrt slop_safety/sensor_guard Nav2 über twist_mux, sobald /scan, /safety/unknown_points (nur streng) oder /odom
# älter als 0,3–0,4 s sind (config/sensor_guard.yaml in slop_safety).
# Humble: Bei action_type "approach" werden `points` ignoriert, das Polygon kommt immer von footprint_topic (Standard
# local_costmap/published_footprint, mit footprint_padding 2 cm).

# ---- B: unbekannte Hindernisse, größere Zonen (Roboter ist langsam und leicht: bewusst knapp)
collision_monitor_dynamic:
  ros__parameters:
    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "cmd_vel_smoothed"
    cmd_vel_out_topic: "cmd_vel_dynamic"
    transform_tolerance: 0.3
    source_timeout: 1.0
    base_shift_correction: True
    stop_pub_timeout: 2.0
    polygons: ["DynStop", "DynSlow", "DynApproach"]
    # Stopp: 10 cm vor der Front (Greifer bzw. Körperschultern), 6 cm seitlich darüber hinaus
    DynStop:
      type: "polygon"
      points: [-0.4, -0.16, 0.1, -0.16, 0.1, -0.22, 0.2, -0.22, 0.2, -0.16, 0.23, -0.16, 0.23, -0.09, 0.31, -0.09, 0.31, -0.15, 0.41, -0.15, 0.41, 0.15, 0.31, 0.15, 0.31, 0.09, 0.23, 0.09, 0.23, 0.16, 0.2, 0.16, 0.2, 0.22, 0.1, 0.22, 0.1, 0.16, -0.4, 0.16]
      action_type: "stop"
      max_points: 2
      visualize: True
      polygon_pub_topic: "polygon_dynamic_stop"
      enabled: True
    # Langsam auf 40 %: 40 cm vor, 15 cm hinter und neben dem Roboter (auch beim Drehen, das Heck schwenkt aus)
    DynSlow:
      type: "polygon"
      points: [-0.55, -0.31, 0.5, -0.31, 0.5, -0.25, 0.53, -0.25, 0.53, -0.24, 0.71, -0.24, 0.71, 0.24, 0.53, 0.24, 0.53, 0.25, 0.5, 0.25, 0.5, 0.31, -0.55, 0.31]
      action_type: "slowdown"
      max_points: 3
      slowdown_ratio: 0.4
      visualize: True
      polygon_pub_topic: "polygon_dynamic_slowdown"
      enabled: True
    # Vorausschau mit dem Footprint: bis zur Berührung ≥ 1 s
    DynApproach:
      type: "polygon"
      action_type: "approach"
      points: [-0.42, -0.18, 0.12, -0.18, 0.12, -0.12, 0.15, -0.12, 0.15, -0.11, 0.33, -0.11, 0.33, 0.11, 0.15, 0.11, 0.15, 0.12, 0.12, 0.12, 0.12, 0.18, -0.42, 0.18]    # unter Humble ignoriert, siehe oben
      time_before_collision: 1.0
      simulation_time_step: 0.1
      max_points: 3
      visualize: False
      enabled: True
    observation_sources: ["unknown"]     # Kamera vorerst aus: ["unknown", "camera"]
    unknown:
      type: "pointcloud"
      topic: "/safety/unknown_points"   # unknown_obstacles, Punkte auf z = 0,5
      min_height: 0.0
      max_height: 2.0
      enabled: True
    camera:
      type: "pointcloud"
      topic: "/camera/obstacles"
      min_height: 0.04
      max_height: 1.0
      enabled: True

# ---- A: alle Punkte, sehr kleine Zonen (letzte Bremse, unabhängig von Karte und Lokalisierung)
collision_monitor:
  ros__parameters:
    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "cmd_vel_dynamic"
    cmd_vel_out_topic: "/navigation/cmd_vel"
    transform_tolerance: 0.3
    source_timeout: 1.0                  # s; ältere Daten werden ignoriert (kein Stopp, siehe oben) → sensor_guard sperrt vorher
    base_shift_correction: True
    stop_pub_timeout: 2.0
    polygons: ["PolygonStop", "PolygonSlow", "FootprintApproach"]
    # Stopp: 2 cm um den Roboter samt Greifer (vorn, seitlich, hinten)
    PolygonStop:
      type: "polygon"
      points: [-0.42, -0.18, 0.12, -0.18, 0.12, -0.12, 0.15, -0.12, 0.15, -0.11, 0.33, -0.11, 0.33, 0.11, 0.15, 0.11, 0.15, 0.12, 0.12, 0.12, 0.12, 0.18, -0.42, 0.18]
      action_type: "stop"
      max_points: 2
      visualize: True
      polygon_pub_topic: "polygon_stop"
      enabled: True
    # Langsam auf 40 %: 10 cm um den Roboter samt Greifer
    PolygonSlow:
      type: "polygon"
      points: [-0.5, -0.26, 0.2, -0.26, 0.2, -0.2, 0.23, -0.2, 0.23, -0.19, 0.41, -0.19, 0.41, 0.19, 0.23, 0.19, 0.23, 0.2, 0.2, 0.2, 0.2, 0.26, -0.5, 0.26]
      action_type: "slowdown"
      max_points: 3
      slowdown_ratio: 0.4
      visualize: True
      polygon_pub_topic: "polygon_slowdown"
      enabled: True
    # Vorausschau mit dem Footprint: bis zur Berührung ≥ 0,6 s (macht die kleinen Zonen frontal sicher)
    FootprintApproach:
      type: "polygon"
      action_type: "approach"
      points: [-0.42, -0.18, 0.12, -0.18, 0.12, -0.12, 0.15, -0.12, 0.15, -0.11, 0.33, -0.11, 0.33, 0.11, 0.15, 0.11, 0.15, 0.12, 0.12, 0.12, 0.12, 0.18, -0.42, 0.18]    # unter Humble ignoriert, siehe oben
      time_before_collision: 0.6
      simulation_time_step: 0.1
      max_points: 3
      visualize: False
      enabled: True
    observation_sources: ["scan"]        # Kamera vorerst aus: ["scan", "camera"]
    scan:
      type: "scan"
      topic: "/scan"
      enabled: True
    camera:
      type: "pointcloud"
      topic: "/camera/obstacles"
      min_height: 0.04
      max_height: 1.0
      enabled: True

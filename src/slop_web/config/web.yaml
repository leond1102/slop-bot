# Slop-Bot Weboberfläche: was die Seite starten darf. Befehle wie in STARTBEFEHLE.md, als Liste (kein Shell-Text).
# Platzhalter: $map (Karte aus maps_dir, im Browser wählbar), $experience_costs (true/false), $safety (streng/locker,
# Sicherheitsstufe von Nav2), $name (Kartenname), $maps_dir. Der Browser kann NUR diese Einträge auslösen.
# uses_safety: true = die Seite zeigt an, in welcher Sicherheitsstufe der Eintrag läuft (aus safety:= in der Befehlszeile).
#
# items      einzelne Starts; conflicts = darf nicht gleichzeitig laufen (z. B. zwei Lidar-Treiber)
#            detect = Teil der Befehlszeile, an dem ein im Terminal gestarteter Prozess erkannt wird
#            ready = Topic, das nach dem Start Daten liefern muss, bevor eine Abfolge weitermacht (ready_age: so alt darf
#            die letzte Nachricht sein, Standard 1 s; ready_timeout: so lange wird gewartet)
# sequences  Abfolgen „alles für …“: Schritte nacheinander, bereits laufende werden übersprungen
# actions    kurze Befehle (Dienstaufrufe), laufen höchstens timeout s

port: 8080
listen: [127.0.0.1, tailscale]       # nur lokal und im Tailnet, nicht im Büro-/Heimnetz
maps_dir: ~/slop-bot_ws/maps
default_map: office-3
workspace_setup: ~/slop-bot_ws/install/setup.bash
state_dir: ~/.ros/slop_web            # welche Programme von hier gestartet wurden (Testserver: eigenen Ordner nehmen!)
log_dir: ~/.ros/log/slop_web          # Ausgabe der gestarteten Programme und Aktionen
ros_setup: /opt/ros/humble/setup.bash

# DDS wie in ~/.bashrc – gilt für den Webserver UND alles, was er startet, egal aus welchem Terminal er kommt.
# Wert = setzen, null = entfernen (z. B. alte Testeinstellungen), nicht genannt = vom Terminal übernehmen.
# Müssen zu Terminals passen, in denen du selbst Nodes startest, sonst sehen sie sich nicht.
dds:
  ROS_LOCALHOST_ONLY: '1'
  FASTRTPS_DEFAULT_PROFILES_FILE: null
  FASTDDS_DEFAULT_PROFILES_FILE: null
  RMW_IMPLEMENTATION: null
  CYCLONEDDS_URI: null

drive:                               # wie slop_teleop/config/keyboard_teleop.yaml
  max_linear: 0.18                   # m/s bei 100 %
  max_angular: 0.4                   # rad/s bei 100 %
  scale: 0.5                         # Start-Tempo (Regler 10…100 %)

items:
  - id: bringup
    label: Antrieb + Modell + EKF
    hint: bestromt die Motoren; Fahren nur mit RustDesk-Sitzung. Braucht die sudo-Regel (slop_web/README.md)
    cmd: [ros2, run, slop_base, with_netcaps, ros2, launch, slop_bringup, bringup.launch.py]
    detect: bringup.launch.py
    ready: /wheel/odom
    ready_timeout: 40

  - id: camera
    label: Kamera + Hinderniserkennung
    cmd: [ros2, launch, slop_sensors, camera.launch.py]
    detect: camera.launch.py
    ready: /camera/obstacles
    ready_timeout: 30

  - id: dock
    label: Dockingstation (ArUco-Marker)
    hint: braucht die Kamera (Farbbild) und für „Andocken“ die Navigation; Marker ID 1 auf Kamerahöhe. Der Dock liegt neben der Karte
    cmd: [ros2, launch, slop_dock, dock.launch.py, 'map:=$map']
    uses_map: true
    detect: dock.launch.py

  - id: localization
    label: Lokalisierung + RViz
    hint: Lidar, LIO, Karte, AMCL, Relokalisierung, Erfahrungskarte
    cmd: [ros2, launch, slop_navigation, localization.launch.py, 'map:=$map']
    uses_map: true
    detect: localization.launch.py
    conflicts: [navigation, mapping, extend]
    ready: /scan
    ready_timeout: 30

  - id: navigation
    label: Navigation (Nav2) + Lokalisierung + RViz
    hint: Ziel in RViz mit „Nav2 Goal“. Sicherheitsstufe oben wählen; wechseln = stoppen und neu starten
    cmd: [ros2, launch, slop_navigation, navigation.launch.py, 'map:=$map', 'experience_costs:=$experience_costs',
          'safety:=$safety']
    uses_map: true
    uses_experience_costs: true
    uses_safety: true
    detect: navigation.launch.py
    conflicts: [localization, mapping, extend]
    ready: /scan
    ready_timeout: 30

  - id: mapping
    label: Kartieren (slam_toolbox) + RViz
    hint: beim Start 2–3 s stillstehen, langsam fahren, zum Schluss zurück zum Start
    cmd: [ros2, launch, slop_navigation, mapping.launch.py]
    detect: mapping.launch.py
    conflicts: [localization, navigation, extend]
    ready: /map                        # slam_toolbox läuft (alle 2 s)
    ready_age: 5
    ready_timeout: 60

  - id: extend
    label: Karte erweitern (slam_toolbox) + RViz
    hint: setzt die gewählte Karte fort; die Startpose wird beim Start am Scan gesucht (Roboter dabei stillstehen lassen).
      Vorher Navigation/Lokalisierung stoppen. Neue Bereiche abfahren, dann „Erweiterte Karte speichern“
    cmd: [ros2, launch, slop_navigation, mapping.launch.py, 'extend:=$map']
    uses_map: true
    detect: 'extend:='
    conflicts: [localization, navigation, mapping]
    ready: /map                        # erst wenn slam_toolbox läuft (nach der Startpose-Suche), nicht schon der Lidar
    ready_age: 5                       # /map kommt alle 2 s
    ready_timeout: 90

sequences:
  - id: all_navigation
    label: Navigation komplett
    steps: [bringup, navigation]       # Nav2 nutzt vorerst nur das Lidar, die Kamera wird nicht gebraucht
  - id: all_localization
    label: Lokalisieren komplett
    steps: [bringup, localization]
  - id: all_dock
    label: Andocken komplett
    steps: [bringup, camera, navigation, dock]
  - id: all_mapping
    label: Kartieren komplett
    steps: [bringup, mapping]
  - id: all_extend
    label: Karte erweitern komplett
    steps: [bringup, extend]

actions:
  - id: cancel_goal
    label: Nav-Ziel abbrechen
    cmds:
      - [ros2, service, call, /navigate_to_pose/_action/cancel_goal, action_msgs/srv/CancelGoal, '{}']
      - [ros2, service, call, /navigate_through_poses/_action/cancel_goal, action_msgs/srv/CancelGoal, '{}']
  - id: relocalize
    label: Pose in der Karte suchen
    cmds: [[ros2, service, call, /relocalize, std_srvs/srv/Trigger]]
  - id: experience_save
    label: Erfahrung speichern
    cmds: [[ros2, service, call, /experience/save, std_srvs/srv/Trigger]]
  - id: map_save
    label: Karte speichern
    needs_name: true
    timeout: 90
    hint: während „Kartieren“ läuft; speichert $name.yaml/.pgm und den slam_toolbox-Stand in maps/ (neuer Name)
    cmds:
      - [ros2, run, nav2_map_server, map_saver_cli, -f, '$maps_dir/$name', --free, '0.196']
      - [ros2, service, call, /slam_toolbox/serialize_map, slam_toolbox/srv/SerializePoseGraph, "{filename: '$maps_dir/$name'}"]
  - id: map_save_extended
    label: Erweiterte Karte speichern
    needs_name: true
    timeout: 90
    hint: während „Karte erweitern“ läuft; speichert unter dem neuen Namen und überträgt Erfahrung und letzte Pose der
      gewählten Karte (die Originalkarte bleibt unverändert)
    cmds:
      - [ros2, run, nav2_map_server, map_saver_cli, -f, '$maps_dir/$name', --free, '0.196']
      - [ros2, service, call, /slam_toolbox/serialize_map, slam_toolbox/srv/SerializePoseGraph, "{filename: '$maps_dir/$name'}"]
      - [ros2, run, slop_navigation, experience_transfer, '$map', '$maps_dir/$name.yaml']
  - id: dock_save
    label: Dock speichern
    hint: Roboter 0,6–1,5 m gerade vor den Marker stellen (Lokalisierung muss passen); vermerkt den Marker in der Karte
    cmds: [[ros2, service, call, /dock/save, std_srvs/srv/Trigger]]
  - id: dock_start
    label: Andocken
    confirm: Der Roboter fährt selbstständig zum Dock. Hand am Notaus – starten?
    hint: Nav2 fährt vor den Marker, dann regelt die Kamera mittig davor
    cmds: [[ros2, service, call, /dock/start, std_srvs/srv/Trigger]]
  - id: dock_cancel
    label: Andocken abbrechen
    cmds: [[ros2, service, call, /dock/cancel, std_srvs/srv/Trigger]]
  - id: drive_off
    label: Endstufen aus
    confirm: Endstufen ausschalten?
    cmds: [[ros2, service, call, /diff_drive/enable, std_srvs/srv/SetBool, 'data: false']]
  - id: drive_on
    label: Endstufen an / Fehler quittieren
    cmds: [[ros2, service, call, /diff_drive/enable, std_srvs/srv/SetBool, 'data: true']]

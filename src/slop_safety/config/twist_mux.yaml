# twist_mux ist der EINZIGE Publisher auf /cmd_vel. diff_drive_node prüft das und steht, wenn noch
# jemand anders auf /cmd_vel sendet. Aufbau wie d_savety/config/twist_mux.yaml im ros2_ws.
# Höhere Priorität gewinnt. Ein Eingang gilt für `timeout` s nach seiner letzten Nachricht als aktiv.
# Eine Sperre (Lock) blockiert alle Eingänge mit KLEINERER Priorität. Sie ist aktiv bei data: true
# ODER wenn länger als `timeout` keine Nachricht kam (auch direkt nach dem Start). timeout 0 = nie.
twist_mux:
  ros__parameters:
    topics:
      teleop:                       # Tastatur / Joystick:
        topic: teleop/cmd_vel       #   ros2 run slop_teleop keyboard_teleop
        timeout: 0.5
        priority: 50
      navigation:                   # Nav2 (Controller-Ausgang auf navigation/cmd_vel umlenken)
        topic: navigation/cmd_vel
        timeout: 0.5
        priority: 20

    locks:
      remote:                       # slop_safety/remote_guard: true = keine RustDesk-Sitzung
        topic: safety/remote_lock   # Node sendet mit 5 Hz. Kommt 1 s nichts (Node tot) → gesperrt.
        timeout: 1.0
        priority: 100               # sperrt alles
      stop:                         # Hand-Stopp: ros2 topic pub --once /safety/stop std_msgs/msg/Bool "data: true"
        topic: safety/stop          # Aufheben mit "data: false". Ohne Nachricht nicht gesperrt (timeout 0).
        timeout: 0.0
        priority: 100
      sensors:                      # slop_safety/sensor_guard (startet mit navigation.launch.py): true = eine Quelle
        topic: safety/sensor_lock   # der Collision Monitore fehlt oder ist veraltet. Node sendet mit 10 Hz. Kommt
        timeout: 0.5                # 0,5 s nichts (Wächter tot oder nicht gestartet) → gesperrt.
        priority: 30                # sperrt nur Nav2 (20); Tastatur und Web (50) fahren weiter
